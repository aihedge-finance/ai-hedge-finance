[project]
name = "ahf"
version = "2.0.0-alpha.1"
description = "AI Hedge Finance — Multi-signal trading system with RL and LLM ensemble"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
rl = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pykalman>=0.9.5",
    "filterpy>=1.4",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.5",
    "mplfinance>=0.12.9b1",
    "stockstats>=0.5",
    "pyarrow>=9.0",
    "tensorboard>=2.13",
    "Bottleneck>=1.3",
    "python-dateutil>=2.8",
    "simplejson>=3.19",
    "coloredlogs>=15.0",
    "loguru>=0.7",
    "psutil>=5.9",
    "click>=8.1",
    # Additional deps required by ported v1 RL code
    "pytz>=2023.3",
    "tqdm>=4.65",
    "PyYAML>=6.0",
    "yfinance>=0.2",
    "statsmodels>=0.14",
    "apprise>=1.7",
]
exchange = [
    "python-binance>=1.0.19",
    "redis>=5.0",
    "schedule>=1.2",
    "requests>=2.31",
]
tuning = [
    "optuna>=3.2",
]
notification = [
    "yagmail>=0.15",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-asyncio>=0.24",
]
all = ["ahf[rl,exchange,tuning,notification,dev]"]

[project.scripts]
ahf-trade    = "ahf.entrypoints.trade:main"
ahf-train    = "ahf.entrypoints.train:main"
ahf-backtest = "ahf.entrypoints.backtest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahf"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

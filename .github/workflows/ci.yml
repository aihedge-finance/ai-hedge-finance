name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.6"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dev deps
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check src/ahf/core/ src/ahf/signals/ src/ahf/domain/ src/ahf/adapters/ src/ahf/entrypoints/ tests/
      - name: Mypy type check
        run: uv run mypy src/ahf/core/ src/ahf/signals/ src/ahf/domain/ src/ahf/adapters/ src/ahf/entrypoints/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.6"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dev deps
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=src/ahf --cov-report=term-missing
